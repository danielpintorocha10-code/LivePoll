<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LivePoll - Enquetes ao Vivo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    
    <style>
        /* Estilos Gerais */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }

        #polls-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Estilo do Cartão da Enquete */
        .poll-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e1e8ed;
        }

        .poll-card h3 {
            margin-top: 0;
            color: #2980b9;
            font-size: 1.3rem;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }

        /* Estilo da Lista e Opções */
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .option-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            margin-bottom: 10px;
            padding: 12px 15px;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }

        .option-item:hover {
            transform: scale(1.01);
            background-color: #f1f3f5;
        }

        .option-name {
            font-weight: 500;
            font-size: 1.1rem;
        }

        .vote-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .vote-count {
            font-weight: bold;
            font-size: 1.2rem;
            color: #e67e22;
            min-width: 30px;
            text-align: right;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        /* Efeito quando recebe um novo voto */
        .vote-count.updated {
            color: #e74c3c;
            transform: scale(1.3);
        }

        /* Botão de Votar */
        .vote-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .vote-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>
    <h1>📊 Enquetes Ativas</h1>
    <div id="polls-container"></div>

    <script>
        const socket = io();

        fetch('/api/polls')
            .then(response => response.json())
            .then(polls => {
                const container = document.getElementById('polls-container');
                polls.forEach(poll => {
                    // Adicionamos as classes CSS no HTML gerado pelo JavaScript
                    let pollHtml = `
                        <div class="poll-card">
                            <h3>${poll.question}</h3>
                            <ul class="options-list">
                    `;
                    
                    poll.options.forEach(opt => {
                        pollHtml += `
                            <li class="option-item">
                                <span class="option-name">${opt.text}</span>
                                <div class="vote-section">
                                    <span class="vote-count" id="votos-${opt.id}">${opt.votes}</span>
                                    <button class="vote-btn" onclick="votar(${opt.id})">Votar</button>
                                </div>
                            </li>
                        `;
                    });
                    
                    pollHtml += `</ul></div>`;
                    container.innerHTML += pollHtml;
                });
            });

        function votar(optionId) {
            socket.emit('submit_vote', { option_id: optionId });
        }

        socket.on('vote_update', function(data) {
            const spanVotos = document.getElementById(`votos-${data.option_id}`);
            if (spanVotos) {
                spanVotos.innerText = data.new_votes;
                
                // Adiciona a classe 'updated' para fazer o número pular e ficar vermelho
                spanVotos.classList.add('updated');
                
                // Remove a classe após 400ms para voltar ao normal
                setTimeout(() => spanVotos.classList.remove('updated'), 400);
            }
        });
    </script>
</body>
</html>
